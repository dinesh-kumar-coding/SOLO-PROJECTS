<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Basketball Scoreboard</title>
        <link rel="shortcut icon" href="images/basketball-favicon.png" type="image/png">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div class = "team-container">
                <h3 class = "title">HOME</h3>
                <div class = "score-box">
                    <h1 id = "home-score" class = "score">0</h1>
                </div>
                <div>
                    <button id = "home1">+1</button>
                    <button id = "home2">+2</button>
                    <button id = "home3">+3</button>
                </div>
            </div>
            <div class = "team-container">
                <h3 class = "title">GUEST</h3>
                <div class = "score-box">
                    <h1 id = "guest-score" class = "score">0</h1>
                </div>
                <div>
                    <button id = "guest1">+1</button>
                    <button id = "guest2">+2</button>
                    <button id = "guest3">+3</button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
